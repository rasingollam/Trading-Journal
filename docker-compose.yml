services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: tj_user
      POSTGRES_PASSWORD: tj_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tj_user -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      until mc alias set local http://storage:9000 minioadmin minioadmin 2>/dev/null; do sleep 2; done &&
      echo 'Creating bucket...' &&
      mc mb local/trades --ignore-existing &&
      echo 'Setting public policy...' &&
      mc anonymous set public local/trades &&
      echo 'MinIO setup complete.'
      "

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://tj_user:tj_pass@db:5432/trading_journal
      MINIO_ENDPOINT: storage:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: trades
      PORT: 3000
      MINIO_USE_SSL: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
